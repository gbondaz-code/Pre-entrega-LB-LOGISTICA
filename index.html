<!DOCTYPE html>
<html lang="es">
<head>

<body>
    <header>
         
        <div class="logo-container">
            <img class="logo-img" src="img/Logo.png" alt="logo del sitio">
        </div>
    
    </header>

    <main>
        <section class="contacto">

            <h1 class="tit-contacto">INICIAR SESION</h1>

            <div class="formulario"> 
            

                <div id="empty_email_error" class="form-container"></div>
                <div id="empty_psw_error" class="form-container"></div>
                <div id="login_error_error" class="form-container"></div>


                <form id="form_login" class="form-container"novalidate> 
               
                    <input id="id_mail" type="email" placeholder="ingrese su email"><br>
                    <input id="id_psw" type="password" name="pass" placeholder="ingrese su contraseña"><br>
                    <button id="btn_login" class="btn-enviar">Ingresar</button>
                </form>


            </div>

        </section>
        
        
    </main>
